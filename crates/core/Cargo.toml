[package]
name = "colab-playground-core"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["http", "mock"]
# Blocking HTTPS client used for Hugging Face lookups. Disabled builds keep the
# whole API and report `ErrorKind::HttpUnavailable` instead.
http = ["dep:ureq"]
# The simulated backend behind demo data and the UI tests. Release downloads leave it out
# (docs/RELEASING.md), so they can only ever run the real one.
mock = []

[dependencies]
base64 = "0.22"
dirs = "6"
# Checks the signature of a release's SHA256SUMS before an update is installed (verifying only).
ed25519-dalek = { version = "3", default-features = false }
# Unpacks the Linux download when the app updates itself (pure Rust, no `tar` process).
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "1"
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
